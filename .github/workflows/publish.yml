name: publish

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    # The test workflow has already succeeded for this commit on main.
    # Publish only when that commit is a pull request merged into main.
    # A direct push stays unpublished. The checkout is the commit the
    # tests ran, and a version already on nuget.org is left there.
    #
    # The API key comes from nuget.org Trusted Publishing: NuGet/login
    # trades this job's GitHub OIDC token for a key that lasts one hour.
    # nuget.org must hold a policy for this repository and publish.yml,
    # and the NUGET_USER secret is the profile name that owns it.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      PROJECT: src/IyaSec.WsFedCaep/IyaSec.WsFedCaep.csproj
    steps:
      - name: Require a pull request merged into main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          count=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | length')
          if [ "$count" = "0" ]; then
            echo "This commit on main did not come from a merged pull request."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Pack the library
        id: pack
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -eu
          mkdir -p artifacts
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            -e DOTNET_NOLOGO=1 \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            dotnet pack "$PROJECT" -c Release -o /src/artifacts \
              -p:ContinuousIntegrationBuild=true
          python3 - <<'PY'
          import glob, os, urllib.error, urllib.request, zipfile
          import xml.etree.ElementTree as ET
          pkgs = glob.glob("artifacts/*.nupkg")
          if len(pkgs) != 1:
              raise SystemExit("expected one package, found %r" % pkgs)
          pkg = pkgs[0]
          with zipfile.ZipFile(pkg) as z:
              spec = [n for n in z.namelist() if n.endswith(".nuspec")][0]
              root = ET.fromstring(z.read(spec))
          meta = root.find("{*}metadata")
          pid = meta.find("{*}id").text
          ver = meta.find("{*}version").text
          lid, lver = pid.lower(), ver.lower()
          url = ("https://api.nuget.org/v3-flatcontainer/%s/%s/%s.nuspec"
                 % (lid, lver, lid))
          try:
              urllib.request.urlopen(url)
              exists = True
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise SystemExit("nuget.org returned %d for %s %s"
                                   % (e.code, pid, ver))
              exists = False
          if exists:
              print("%s %s is already on nuget.org." % (pid, ver))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("package=%s\n" % pkg)
              fh.write("push=%s\n" % ("false" if exists else "true"))
          PY

      - name: Trade the OIDC token for a nuget.org API key
        id: login
        if: steps.pack.outputs.push == 'true'
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push the package
        if: steps.pack.outputs.push == 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE: ${{ steps.pack.outputs.package }}
        run: |
          set -eu
          docker run --rm \
            -v "$PWD/artifacts":/src/artifacts \
            -w /src \
            -e NUGET_API_KEY \
            -e PACKAGE \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            -e DOTNET_NOLOGO=1 \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            sh -c 'dotnet nuget push "$PACKAGE" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json'
